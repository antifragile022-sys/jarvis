name: Build Windows EXE

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install UPX (compression)
        shell: powershell
        run: |
          choco install upx -y --no-progress
          upx --version

      - name: Install Python deps
        shell: powershell
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Download Vosk RU model (small)
        shell: powershell
        run: |
          python scripts/fetch_model.py --model small --dest models

      - name: Build EXE
        shell: powershell
        run: |
          pyinstaller jarvis.spec --clean --noconfirm
          Get-ChildItem dist | Format-Table Name,Length
          $size = (Get-Item dist/Jarvis.exe).Length / 1MB
          Write-Output ("Jarvis.exe size: {0:N1} MB" -f $size)

      - name: Smoke test (текстовый режим, без mic)
        shell: powershell
        run: |
          .\dist\Jarvis.exe once "сколько времени"
          if (-not (Test-Path .\dist\Jarvis.exe)) { exit 1 }

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Jarvis-windows
          path: dist/Jarvis.exe
          if-no-files-found: error

      - name: Attach to GitHub Release (only on tag push)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/Jarvis.exe
          generate_release_notes: true
