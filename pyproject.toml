[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "jarvis-ru"
version = "0.1.0"
description = "Голосовой ассистент в стиле Джарвиса для Windows (русский, оффлайн STT, Gemini-агент)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "antifragile022" }]
dependencies = [
    "python-dotenv>=1.0.0",
    "vosk>=0.3.45",
    "sounddevice>=0.4.6",
    "pyttsx3>=2.90",
    "pywin32>=306; sys_platform == 'win32'",
    "pycaw>=20240210; sys_platform == 'win32'",
    "comtypes>=1.4.0; sys_platform == 'win32'",
    "screen-brightness-control>=0.22.0",
    "psutil>=5.9.0",
    "mss>=9.0.1",
    "pyautogui>=0.9.54",
    "Pillow>=10.0.0",
    "requests>=2.31.0",
    "google-genai>=1.0.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-cov>=4.1", "ruff>=0.5"]

[project.scripts]
jarvis = "jarvis.__main__:main"

[tool.setuptools.packages.find]
include = ["jarvis*"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]
ignore = ["E501", "B008"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra -q"
